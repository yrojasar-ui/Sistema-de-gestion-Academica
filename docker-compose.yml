services:
  rabbitmq:
    image: rabbitmq:4.0-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS en .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - biblioteca_interna
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      AMQP_USER: ${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER en .env}
      AMQP_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS en .env}
    command:
      - --storage
      - local
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --initial
      - /app/data/libros_iniciales.json
      - --working
      - /var/lib/biblioteca/datos/biblioteca-local.json
      - --auth-store
      - /var/lib/biblioteca/privado/cuentas.json
      - --service-token-file
      - /var/lib/biblioteca/privado/service.token
      - --demo-charge
      - ${DEMO_CHARGE:-10000}
      - --currency
      - ${DEMO_CURRENCY:-CRC}
      - --session-seconds
      - ${SESSION_SECONDS:-1800}
      - --origin
      - ${CORS_ORIGIN:-http://127.0.0.1:5173}
      - --trusted-proxy
      - 127.0.0.1
      - --trusted-proxy
      - 172.28.0.10
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - biblioteca_datos:/var/lib/biblioteca/datos
      - biblioteca_privado:/var/lib/biblioteca/privado
      - biblioteca_mongo:/var/lib/biblioteca/mongo-runtime
    networks:
      - biblioteca_interna
    deploy:
      replicas: 1

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    entrypoint: ["/usr/local/bin/biblioteca_worker"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      AMQP_USER: ${RABBITMQ_DEFAULT_USER:?Defina RABBITMQ_DEFAULT_USER en .env}
      AMQP_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Defina RABBITMQ_DEFAULT_PASS en .env}
    command:
      - --service-token-file
      - /var/lib/biblioteca/privado/service.token
      - --max-retries
      - "3"
      - --backoff-ms
      - "1000"
    volumes:
      # Solo lectura del token de servicio; el worker nunca escribe archivos de negocio ni Mongo.
      - biblioteca_privado:/var/lib/biblioteca/privado:ro
    networks:
      - biblioteca_interna

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8081"
    networks:
      biblioteca_interna:
        ipv4_address: 172.28.0.10

networks:
  biblioteca_interna:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  biblioteca_datos:
  biblioteca_privado:
  biblioteca_mongo:
  rabbitmq_data:
