<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="Diagrama de despliegue de Biblioteca Académica">
  <defs>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#1f5373"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #152b38; }
      .t { font-size: 12px; font-weight: bold; fill: #132f45; }
      .s { font-size: 10.5px; fill: #3c5463; }
      .z { fill: #f5f8fa; stroke: #a9becb; stroke-width: 1.4; rx: 8; }
      .z-priv { fill: #f2f7f5; stroke: #4b7a6c; stroke-width: 1.5; stroke-dasharray: 6 3; rx: 8; }
      .box { fill: #ffffff; stroke: #1f5373; stroke-width: 1.4; rx: 6; }
      .rmq { fill: #fff6e8; stroke: #b07428; stroke-width: 1.4; rx: 6; }
      .vol { fill: #f9eff0; stroke: #8e3b3b; stroke-width: 1.3; rx: 6; }
      .ln { fill: none; stroke: #1f5373; stroke-width: 1.7; marker-end: url(#da); }
      .lbl { font-size: 10px; font-weight: bold; fill: #1f5373; }
    </style>
  </defs>

  <!-- Zona Cliente & Pages -->
  <rect class="z" x="14" y="14" width="236" height="362"/>
  <text class="t" x="26" y="34">Internet Público (Cliente)</text>

  <rect class="box" x="28" y="48" width="208" height="72"/>
  <text class="t" x="38" y="68">Navegador (Escritorio / Móvil)</text>
  <text class="s" x="38" y="85">• Sesión Bearer solo en RAM</text>
  <text class="s" x="38" y="100">• Sin cookies ni localStorage</text>
  <text class="s" x="38" y="114">• Reconciliación GET ante fallo</text>

  <rect class="box" x="28" y="146" width="208" height="92" style="fill:#edf5fa"/>
  <text class="t" x="38" y="166">GitHub Pages (Publicado)</text>
  <text class="s" x="38" y="183">yrojasar-ui.github.io/</text>
  <text class="s" x="38" y="197">Sistema-de-gestion-Academica/</text>
  <text class="s" x="38" y="213">• Solo estático (HTML/JS/CSS)</text>
  <text class="s" x="38" y="227">• VITE_API_URL sin /api</text>

  <rect class="box" x="28" y="264" width="208" height="96" style="stroke:#6e4b8c"/>
  <text class="t" x="38" y="284" style="fill:#52316b">GitHub Actions (CI/CD)</text>
  <text class="s" x="38" y="301">• CTest Debug + RabbitMQ real</text>
  <text class="s" x="38" y="316">• CTest ASan/UBSan + fugas</text>
  <text class="s" x="38" y="331">• Frontend 19/19 + verify:dist</text>
  <text class="s" x="38" y="346">• Deploy Pages solo tras CI</text>

  <!-- Zona Red Privada Backend -->
  <rect class="z-priv" x="276" y="14" width="430" height="362"/>
  <text class="t" x="290" y="34" style="fill:#214e41">Host Linux / Docker Compose (Red Privada biblioteca_interna)</text>

  <rect class="box" x="290" y="48" width="402" height="58" style="fill:#edf5fa"/>
  <text class="t" x="302" y="68">Proxy Inverso HTTPS (Caddy / Nginx · Puerto 443 / 127.0.0.1:5173)</text>
  <text class="s" x="302" y="84">TLS 1.2/1.3 · Bloquea /api/interno/* (403) · Envía X-Forwarded-For confiable</text>
  <text class="s" x="302" y="98">Estado remoto: plantilla lista, proveedor HTTPS pendiente de decisión</text>

  <rect class="box" x="290" y="128" width="194" height="106"/>
  <text class="t" x="300" y="148">catalogo_api (replicas: 1)</text>
  <text class="s" x="300" y="164">• Único escritor del dominio</text>
  <text class="s" x="300" y="179">• --origin Pages exacto</text>
  <text class="s" x="300" y="194">• --trusted-proxy IP proxy</text>
  <text class="s" x="300" y="209">• Outbox Relay desacoplado</text>
  <text class="s" x="300" y="224">• Healthcheck /healthz</text>

  <rect class="rmq" x="502" y="128" width="190" height="106"/>
  <text class="t" x="512" y="148">RabbitMQ 4.0 (NO público)</text>
  <text class="s" x="512" y="164">• Puerto 5672 solo red interna</text>
  <text class="s" x="512" y="179">• Colas durables + DLQ</text>
  <text class="s" x="512" y="194">• Volumen rabbitmq_data</text>
  <text class="s" x="512" y="209">• Sin puertos 5672/15672</text>
  <text class="s" x="512" y="224">  expuestos a Internet</text>

  <rect class="box" x="502" y="256" width="190" height="104" style="stroke:#285f4b"/>
  <text class="t" x="512" y="276" style="fill:#1f4f3d">biblioteca_worker (C++17)</text>
  <text class="s" x="512" y="292">• Proceso independiente</text>
  <text class="s" x="512" y="307">• Monta service.token (:ro)</text>
  <text class="s" x="512" y="322">• ACK manual tras HTTP 200</text>
  <text class="s" x="512" y="337">• Reintentos + DLQ durable</text>
  <text class="s" x="512" y="352">• Cierre ordenado SIGTERM</text>

  <rect class="vol" x="290" y="256" width="194" height="104"/>
  <text class="t" x="300" y="276" style="fill:#752b2b">Volúmenes Persistentes</text>
  <text class="s" x="300" y="292">• biblioteca_privado (0700):</text>
  <text class="s" x="300" y="306">  cuentas.json, service.token</text>
  <text class="s" x="300" y="322">• biblioteca_datos (JSON v2)</text>
  <text class="s" x="300" y="338">• biblioteca_mongo (.pending)</text>
  <text class="s" x="300" y="352">• Conservados al reiniciar</text>

  <!-- Zona Nube Externa -->
  <rect class="z" x="732" y="14" width="214" height="362"/>
  <text class="t" x="744" y="34">Persistencia Cloud</text>

  <rect class="box" x="746" y="128" width="186" height="162" style="fill:#eef5fb"/>
  <text class="t" x="756" y="150">API MongoDB Docente</text>
  <text class="s" x="756" y="168">paginas-web-cr.com/</text>
  <text class="s" x="756" y="182">Api/apis/mongodb.php</text>
  <text class="s" x="756" y="202">• Colección dedicada</text>
  <text class="s" x="756" y="218">• Documento agregado</text>
  <text class="s" x="756" y="234">• PUT por revision + GET</text>
  <text class="s" x="756" y="250">• 0 credenciales guardadas</text>
  <text class="s" x="756" y="266">• Límite agregado: 1 MiB</text>

  <!-- Flechas -->
  <path class="ln" d="M132 120 L132 146"/>
  <path class="ln" d="M236 77 L290 77"/>
  <text class="lbl" x="242" y="71">HTTPS</text>
  <path class="ln" d="M387 106 L387 128"/>
  <path class="ln" d="M484 176 L502 176"/>
  <path class="ln" d="M597 234 L597 256"/>
  <path class="ln" d="M502 290 L492 290 L492 210 L484 210"/>
  <path class="ln" d="M387 234 L387 256"/>
  <path class="ln" d="M484 152 L494 152 L494 116 L718 116 L718 190 L746 190"/>
  <text class="lbl" x="712" y="110">HTTPS (--storage mongo)</text>
</svg>
