<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-label="Arquitectura por componentes de Biblioteca Académica">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#20526c"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#8b5a1e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #152b38; }
      .title { font-size: 13px; font-weight: bold; fill: #132f45; }
      .sub { font-size: 11px; fill: #3c5463; }
      .grp { fill: #f5f8fa; stroke: #b8c9d4; stroke-width: 1.4; rx: 8; }
      .box { fill: #ffffff; stroke: #2c6282; stroke-width: 1.4; rx: 6; }
      .box-accent { fill: #ecf4f8; stroke: #1f5373; stroke-width: 1.6; rx: 6; }
      .box-rmq { fill: #fff6e8; stroke: #b07428; stroke-width: 1.5; rx: 6; }
      .box-priv { fill: #f8eff0; stroke: #8e3b3b; stroke-width: 1.4; rx: 6; }
      .lbl { font-size: 10.5px; font-weight: bold; fill: #20526c; }
      .link { fill: none; stroke: #20526c; stroke-width: 1.8; marker-end: url(#arr); }
      .link-rmq { fill: none; stroke: #8b5a1e; stroke-width: 1.8; marker-end: url(#arr2); }
    </style>
  </defs>

  <!-- Frontend & Proxy -->
  <rect class="grp" x="12" y="14" width="215" height="170"/>
  <text class="title" x="24" y="34">1. Frontend &amp; Borde HTTPS</text>
  <rect class="box" x="24" y="46" width="191" height="54"/>
  <text class="title" x="34" y="66">React 19 + TS + Vite</text>
  <text class="sub" x="34" y="83">Catálogo · Mi biblioteca · Mis avisos</text>
  <text class="sub" x="34" y="95">Pagos SIMULADO · Paneles Admin</text>

  <rect class="box-accent" x="24" y="114" width="191" height="58"/>
  <text class="title" x="34" y="133">Proxy Inverso HTTPS</text>
  <text class="sub" x="34" y="148">TLS · CORS exacto · Rate-limit</text>
  <text class="sub" x="34" y="162">Bloquea /api/interno/* (403)</text>
  <path class="link" d="M120 100 L120 114"/>

  <!-- API C++17 -->
  <rect class="grp" x="255" y="14" width="405" height="300"/>
  <text class="title" x="268" y="34">2. catalogo_api (C++17 · Escritor Único · ThreadPool 1)</text>

  <rect class="box-accent" x="268" y="46" width="379" height="44"/>
  <text class="title" x="278" y="64">HttpController + stateMutex + trusted-proxy</text>
  <text class="sub" x="278" y="80" style="font-size:10px">Públicas (/healthz,/readyz), humanas (Bearer) e internas (/api/interno/*)</text>

  <rect class="box-priv" x="268" y="102" width="182" height="58"/>
  <text class="title" x="278" y="121">AuthService (Argon2id)</text>
  <text class="sub" x="278" y="136">Sesiones opacas en RAM</text>
  <text class="sub" x="278" y="150">Roles ADMIN / USUARIO</text>

  <rect class="box-priv" x="462" y="102" width="185" height="58"/>
  <text class="title" x="472" y="121">ServiceIdentity (Mínima)</text>
  <text class="sub" x="472" y="136">Hash BLAKE2b en RAM</text>
  <text class="sub" x="472" y="150">Solo /api/interno/avisos/*</text>

  <rect class="box" x="268" y="172" width="230" height="62"/>
  <text class="title" x="278" y="191">CatalogService + LibraryService</text>
  <text class="sub" x="278" y="206">Reglas de dominio v2 · Validación total</text>
  <text class="sub" x="278" y="220">Commit por swap tras confirmar repo</text>

  <rect class="box-rmq" x="510" y="172" width="137" height="62"/>
  <text class="title" x="518" y="191">Outbox Relay</text>
  <text class="sub" x="518" y="206">Hilo desacoplado</text>
  <text class="sub" x="518" y="220">No bloquea HTTP</text>

  <rect class="box-accent" x="268" y="246" width="379" height="54"/>
  <text class="title" x="278" y="265">5 Estructuras Académicas Propias en C++17</text>
  <text class="sub" x="278" y="282">B+ (Catálogo) · Rojo-Negro (Activos) · Hash Extensible (Usuarios)</text>
  <text class="sub" x="278" y="294">Grafo de Temas (Adyacencia) · FIFO propia por libro (Turnos)</text>

  <!-- RabbitMQ & Worker -->
  <rect class="grp" x="688" y="14" width="260" height="300"/>
  <text class="title" x="700" y="34">3. Mensajería Asincrónica Real</text>

  <rect class="box-rmq" x="702" y="48" width="232" height="96"/>
  <text class="title" x="712" y="68">RabbitMQ 4.0.5 (Red Interna)</text>
  <text class="sub" x="712" y="84">Exchange: biblioteca.eventos (durable)</text>
  <text class="sub" x="712" y="99">Cola: biblioteca.avisos (durable)</text>
  <text class="sub" x="712" y="114">DLX/DLQ: biblioteca.avisos.fallidos</text>
  <text class="sub" x="712" y="129">Publisher confirms + mandatory=1</text>

  <rect class="box" x="702" y="176" width="232" height="124"/>
  <text class="title" x="712" y="196">biblioteca_worker (C++17)</text>
  <text class="sub" x="712" y="212">Proceso independiente (rabbitmq-c)</text>
  <text class="sub" x="712" y="227">basic.qos(1) · ACK manual post-efecto</text>
  <text class="sub" x="712" y="242">Reintentos acotados + backoff</text>
  <text class="sub" x="712" y="257">Mensaje inválido / agotado → DLQ</text>
  <text class="sub" x="712" y="272">NO escribe directo en Mongo/JSON</text>
  <text class="sub" x="712" y="287">Usa token de servicio 0600 (:ro)</text>

  <!-- Persistencia -->
  <rect class="grp" x="12" y="344" width="936" height="152"/>
  <text class="title" x="24" y="365">4. Persistencia Explícita (sin fallback silencioso · credenciales separadas del negocio)</text>

  <rect class="box-priv" x="26" y="380" width="278" height="100"/>
  <text class="title" x="38" y="400">Almacén Privado Local (0700 / 0600)</text>
  <text class="sub" x="38" y="418">• cuentas.json (Argon2id, fuera de Mongo)</text>
  <text class="sub" x="38" y="434">• service.token (256 bits, solo lectura worker)</text>
  <text class="sub" x="38" y="450">• amqp.creds (credenciales broker locales)</text>
  <text class="sub" x="38" y="466">• Bloqueo flock exclusivo e independiente</text>

  <rect class="box" x="328" y="380" width="286" height="100"/>
  <text class="title" x="340" y="400">LocalLibraryRepository (Modo Local)</text>
  <text class="sub" x="340" y="418">• Agregado JSON v2 (libros + dominio)</text>
  <text class="sub" x="340" y="434">• Incluye avisos, notificaciones y pagos</text>
  <text class="sub" x="340" y="450">• Escritura atómica: tmp + fsync + rename</text>
  <text class="sub" x="340" y="466">• Consola E2 conserva JsonBookRepository</text>

  <rect class="box-accent" x="638" y="380" width="296" height="100"/>
  <text class="title" x="650" y="400">MongoLibraryRepository (Modo Cloud)</text>
  <text class="sub" x="650" y="418">• Agregado único versionado (revision +1)</text>
  <text class="sub" x="650" y="434">• Diario durable .pending.json antes de red</text>
  <text class="sub" x="650" y="450">• Confirmación por GET antes de publicar</text>
  <text class="sub" x="650" y="466">• Bloqueo ante incertidumbre · recuperación GET</text>

  <!-- Conexiones -->
  <path class="link" d="M215 142 L240 142 L240 68 L268 68"/>
  <text class="lbl" x="220" y="135">HTTPS</text>

  <path class="link" d="M358 90 L358 102"/>
  <path class="link" d="M554 90 L554 102"/>
  <path class="link" d="M380 160 L380 172"/>
  <path class="link" d="M380 234 L380 246"/>
  <path class="link-rmq" d="M498 203 L510 203"/>
  <path class="link-rmq" d="M647 195 L674 195 L674 96 L702 96"/>
  <text class="lbl" x="649" y="150" style="fill:#8b5a1e">AMQP</text>

  <path class="link-rmq" d="M818 144 L818 176"/>
  <text class="lbl" x="824" y="164" style="fill:#8b5a1e">consume/ACK</text>

  <!-- Worker -> API interno -->
  <path class="link" d="M702 252 L670 252 L670 68 L647 68"/>
  <text class="lbl" x="648" y="302">/api/interno/*</text>

  <!-- API -> Persistencia -->
  <path class="link" d="M312 160 L236 160 L236 380"/>
  <path class="link" d="M450 314 L450 380"/>
  <path class="link" d="M580 314 L580 330 L786 330 L786 380"/>
</svg>
